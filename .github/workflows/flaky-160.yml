# TEMPORARY — #160 step S (investigations/flaky-160/stepS/PLAN.md §6).
# Exists only on branch claude/dec-029-path-b-src-d122e1 and is removed in its own commit before Ready.
# Runs nothing but the setup steps of ci.yml (checkout, setup-php, composer update) and
# investigations/flaky-160/stepS/harness/, whose only test command is the pinned vendor/bin/phpunit with a harness
# bootstrap given on the command line. No secrets, contents: read. No push trigger: a push never starts it.
# Every job keeps its resolved composer.lock and the PHPUnit / PHP versions in its artifact (phase-1 env.sh, unchanged).
#
# Modes (one dispatch with `all`, by the Owner's word and only after the measured cost is on the PR):
#   checks    V-TRANSFORM (W1 store), V-CLOCK-2, W3 checks and detectors
#   adet      A-DET-1741 (20 per variant)
#   anat      A-NAT shards on the change, all workers' rows kept
#   decision  V-DECISION: Unit + Integration + System under W3, base and change
#   timing    persistWinningCandidates timing under W3, base and change alternating
name: flaky-160s (temporary)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all | checks | adet | anat | decision | timing'
        required: true
        type: choice
        options: [all, checks, adet, anat, decision, timing]
      shards:
        description: 'anat: JSON list of shard numbers'
        required: false
        default: '[1,2,3,4,5,6,7,8]'
      per:
        description: 'anat: runs per shard'
        required: false
        default: '250'
      timing_runs:
        description: 'timing: runs per arm'
        required: false
        default: '200'

permissions:
  contents: read

jobs:
  checks:
    name: V-TRANSFORM, V-CLOCK-2, W3 checks
    if: inputs.mode == 'all' || inputs.mode == 'checks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160s" checks
      - run: bash investigations/flaky-160/stepS/harness/run.sh vtransform "$RUNNER_TEMP/f160s"
      - run: bash investigations/flaky-160/stepS/harness/run.sh vclock2 "$RUNNER_TEMP/f160s"
      - run: bash investigations/flaky-160/stepS/harness/run.sh w3check "$RUNNER_TEMP/f160s"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160s-checks
          path: ${{ runner.temp }}/f160s
          retention-days: 30

  adet:
    name: A-DET-1741
    if: inputs.mode == 'all' || inputs.mode == 'adet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160s" adet
      - run: bash investigations/flaky-160/stepS/harness/run.sh vtransform "$RUNNER_TEMP/f160s"
      - run: bash investigations/flaky-160/stepS/harness/run.sh vclock2 "$RUNNER_TEMP/f160s"
      - run: bash investigations/flaky-160/stepS/harness/run.sh a1741 "$RUNNER_TEMP/f160s" 20
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160s-adet
          path: ${{ runner.temp }}/f160s
          retention-days: 30

  anat:
    name: A-NAT shard ${{ matrix.shard }}
    if: inputs.mode == 'all' || inputs.mode == 'anat'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1,2,3,4,5,6,7,8]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160s" "anat-${{ matrix.shard }}"
      - run: bash investigations/flaky-160/stepS/harness/run.sh vtransform "$RUNNER_TEMP/f160s"
      - run: bash investigations/flaky-160/stepS/harness/run.sh anat "$RUNNER_TEMP/f160s" "${{ matrix.shard }}" "${{ inputs.per || '250' }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160s-anat-${{ matrix.shard }}
          path: ${{ runner.temp }}/f160s
          retention-days: 30

  decision:
    name: V-DECISION ${{ matrix.which }}
    if: inputs.mode == 'all' || inputs.mode == 'decision'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        which: [base, change]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160s" "decision-${{ matrix.which }}"
      - run: bash investigations/flaky-160/stepS/harness/run.sh w3check "$RUNNER_TEMP/f160s"
      - run: bash investigations/flaky-160/stepS/harness/run.sh decision "$RUNNER_TEMP/f160s" "${{ matrix.which }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160s-decision-${{ matrix.which }}
          path: ${{ runner.temp }}/f160s
          retention-days: 30

  timing:
    name: persistWinningCandidates timing
    if: inputs.mode == 'all' || inputs.mode == 'timing'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160s" timing
      - run: bash investigations/flaky-160/stepS/harness/run.sh w3check "$RUNNER_TEMP/f160s"
      - run: bash investigations/flaky-160/stepS/harness/run.sh timing "$RUNNER_TEMP/f160s" "${{ inputs.timing_runs || '200' }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160s-timing
          path: ${{ runner.temp }}/f160s
          retention-days: 30
