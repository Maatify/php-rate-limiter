# TEMPORARY — #160 step M (investigations/flaky-160/stepM/PLAN.md §7, §8).
# Restored from phase 2b by `git revert 8f3d29c` (own commit), then adapted in the next commit.
# Exists only on branch claude/measurement-p1-dec-029-3e6294 and is removed in its own commit before Ready.
# Runs nothing but the setup steps of ci.yml (checkout, setup-php, composer update) and
# investigations/flaky-160/stepM/harness/, whose only test command is the pinned vendor/bin/phpunit with a
# harness bootstrap given on the command line. No secrets, contents: read. No push trigger: a push never starts it.
# Every job keeps its resolved composer.lock and the PHPUnit / PHP versions in its artifact
# (phase-1 harness/env.sh, used unchanged).
#
# Modes (one dispatch with `all`, by the Owner's word and only after the measured cost is on the PR):
#   checks  V-TRANSFORM (W1), V-CLOCK-2, V-TRANSFORM and detectors of W2 (m2b_check.php)
#   adet    A-DET-1741 (20 per variant) and A-DET-2168 re-run on b6f4e22 (20 per variant)
#   suite   M2b: Integration + System once under W2
name: flaky-160m (temporary)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all | checks | adet | suite'
        required: true
        type: choice
        options: [all, checks, adet, suite]

permissions:
  contents: read

jobs:
  checks:
    name: V-TRANSFORM, V-CLOCK-2, W2 checks
    if: inputs.mode == 'all' || inputs.mode == 'checks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160m" checks
      - run: bash investigations/flaky-160/stepM/harness/run.sh vtransform "$RUNNER_TEMP/f160m"
      - run: bash investigations/flaky-160/stepM/harness/run.sh vclock2 "$RUNNER_TEMP/f160m"
      - run: bash investigations/flaky-160/stepM/harness/run.sh m2bcheck "$RUNNER_TEMP/f160m"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160m-checks
          path: ${{ runner.temp }}/f160m
          retention-days: 30

  adet:
    name: A-DET-1741 and A-DET-2168
    if: inputs.mode == 'all' || inputs.mode == 'adet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160m" adet
      - run: bash investigations/flaky-160/stepM/harness/run.sh vtransform "$RUNNER_TEMP/f160m"
      - run: bash investigations/flaky-160/stepM/harness/run.sh vclock2 "$RUNNER_TEMP/f160m"
      - run: bash investigations/flaky-160/stepM/harness/run.sh a1741 "$RUNNER_TEMP/f160m" 20
      - run: bash investigations/flaky-160/stepM/harness/run.sh adet "$RUNNER_TEMP/f160m" 20
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160m-adet
          path: ${{ runner.temp }}/f160m
          retention-days: 30

  suite:
    name: M2b Integration + System under W2
    if: inputs.mode == 'all' || inputs.mode == 'suite'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: redis
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: bash investigations/flaky-160/harness/env.sh "$RUNNER_TEMP/f160m" suite
      - run: bash investigations/flaky-160/stepM/harness/run.sh m2bcheck "$RUNNER_TEMP/f160m"
      - run: bash investigations/flaky-160/stepM/harness/run.sh suite "$RUNNER_TEMP/f160m" Integration,System
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f160m-suite
          path: ${{ runner.temp }}/f160m
          retention-days: 30
