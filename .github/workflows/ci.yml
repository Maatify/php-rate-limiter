name: CI Quality Gate

on:
  push:
    branches:
      - main
      - draft/extraction-blueprint
  pull_request:
    branches:
      - main
      - draft/extraction-blueprint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Composer Validate
        run: composer validate --strict

  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check Syntax
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install Dependencies
        run: composer update --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer phpstan

  tests:
    name: Test Suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install Dependencies
        run: composer update --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test

  gate:
    name: Final Gate
    if: always()
    needs: [composer-validate, php-syntax, static-analysis, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Upstream Jobs
        run: |
          if [ "${{ needs.composer-validate.result }}" != "success" ] || \
             [ "${{ needs.php-syntax.result }}" != "success" ] || \
             [ "${{ needs.static-analysis.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ]; then
            echo "One or more upstream jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
